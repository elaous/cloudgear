syntax = "proto3";

package cloudgear;

message Config {
  string project = 1;
  string provider = 2;
  repeated Resource resource = 3;
  repeated Function function = 4;
  repeated string invoker = 5;
  string authenticated = 6;
  reserved 7;
  repeated Certificate certificate = 8;
  repeated Cdn cdn = 9;
  Api api = 11;
  // Empty: region from --region or AWS_REGION.
  string region = 10;
}

message Api {
  string provider = 1;
  string domain = 2;
  string via = 3;
  bool method_routing = 4;
  map<string, string> options = 5;
  string certificate = 6;
}

message Dns {
  string provider = 1;
  string domain = 2;
  string zone = 3;
  // Read from a secret at apply time; never stored here.
  SecretRef token = 4;
}

message SecretRef {
  string provider = 1;
  string service = 2;
  string region = 3;
  string path = 4;
  string name = 5;
  string kms_key = 6;
}

message SecretBinding {
  string provider = 1;
  string service = 2;
  string region = 3;
  string path = 4;
  string name = 5;
  string env = 6;
  bool all = 7;
  string kms_key = 8;
}

message Certificate {
  string domain = 1;
  map<string, string> options = 2;
  Dns dns = 3;
  string usage = 4;
  // Empty: us-east-1 for CDN or unused, function region for API.
  string region = 5;
  string provider = 6;
}

message Cdn {
  string provider = 1;
  string domain = 2;
  string bucket = 3;
  string path = 4;
  reserved 5;
  map<string, string> options = 6;
  string certificate = 7;
}

message Resource {
  string name = 1;
  string type = 2;
  string physical_name = 3;
  // Never created, updated or deleted.
  bool dry = 4;
  string source = 5;
  string region = 6;
  map<string, string> options = 7;
}

message Function {
  string name = 1;
  string type = 2;
  string physical_name = 3;
  string runtime = 4;
  int32 memory_mb = 5;
  int32 timeout_s = 6;
  Source source = 7;
  repeated Route route = 8;
  Bundle bundle = 9;
  repeated Permission permission = 10;
  repeated Env env = 11;
  // 0 leaves concurrency unreserved.
  int32 reserved_concurrency = 12;
  map<string, string> options = 13;
  repeated string schedule = 14;
  repeated string include = 15;
  bool pass_request = 16;
  reserved 17;
  string response_arg = 18;
  repeated SecretBinding secret = 19;
  repeated EventTrigger event = 20;
  reserved 21;
  repeated QuerySchedule query_schedule = 22;
  // Inline IAM policies put on the function's role.
  repeated InlinePolicy policy = 23;
}

message InlinePolicy {
  string name = 1;
  // The policy document as JSON text.
  string document = 2;
}

message QuerySchedule {
  string cron = 1;
  map<string, string> query = 2;
}

message EventTrigger {
  string bus = 1;
  string type = 2;
  // Empty matches any source.
  string source = 3;
}

message Source {
  string file = 1;
  string export = 2;
  string input_type = 3;
  string member = 4;
}

message Route {
  string method = 1;
  string path = 2;
  string name = 3;
}

message Bundle {
  string path = 1;
  string sha256 = 2;
}

message Permission {
  string resource = 1;
  repeated string action = 2;
  string path = 3;
}

message Env {
  string key = 1;
  oneof source {
    string value = 2;
    string value_from = 3;
  }
}
