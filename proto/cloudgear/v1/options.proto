syntax = "proto3";

package cloudgear.v1;

import "google/protobuf/descriptor.proto";

// What a call on a resource needs permission to do.
enum Intent {
  INTENT_UNSPECIFIED = 0;
  INTENT_READ = 1;
  INTENT_WRITE = 2;
  INTENT_DELETE = 3;
  INTENT_LIST = 4;
}

// A method of the resource's runtime class and the intents calling it implies.
message Operation {
  string method = 1;
  repeated Intent intents = 2;
}

extend google.protobuf.FieldOptions {
  // Changing it after creation means replacing the resource.
  bool immutable = 50001;
  // Applied when the field is unset.
  string default_value = 50002;
  // The field refers to a resource; the value is the message of that resource, such as "Dns".
  // Written as the resource itself in setup files, stored as its name.
  string references = 50003;
  // A setup file MUST set it, whatever the type; an enum without a default is required already.
  bool required = 50004;
}

extend google.protobuf.EnumValueOptions {
  // The name used in setup.ts; the enum value name is not.
  string name = 50021;
}

extend google.protobuf.MessageOptions {
  // Documentation only; the drivers enforce protection.
  bool protected = 50011;
  // Methods whose calls the analyzer turns into permissions.
  repeated Operation operations = 50012;
}
