syntax = "proto3";

package cloudgear.v1;

import "cloudgear/v1/options.proto";

enum CertProvider {
  CERT_PROVIDER_UNSPECIFIED = 0;
  CERT_PROVIDER_AWS = 1 [(cloudgear.v1.name) = "aws"];
}

// A certificate for the domain of a Dns, validated through that Dns.
message Cert {
  CertProvider provider = 1 [(cloudgear.v1.immutable) = true];
  string name = 2;
  // The Dns whose domain the certificate covers.
  string dns = 3 [(cloudgear.v1.references) = "Dns"];
  // The default differs for a CDN and for a router.
  optional string region = 4;
  map<string, string> options = 5;
}
