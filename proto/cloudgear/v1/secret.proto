syntax = "proto3";

package cloudgear.v1;

import "cloudgear/v1/options.proto";

enum SecretProvider {
  SECRET_PROVIDER_UNSPECIFIED = 0;
  SECRET_PROVIDER_AWS = 1 [(cloudgear.v1.name) = "aws"];
}

enum SecretService {
  SECRET_SERVICE_UNSPECIFIED = 0;
  SECRET_SERVICE_SSM = 1 [(cloudgear.v1.name) = "ssm"];
  SECRET_SERVICE_SECRETSMANAGER = 2 [(cloudgear.v1.name) = "secretsmanager"];
}

// Where secrets are kept. cloudgear grants access to them and reads them; it never stores values.
message SecretStore {
  SecretProvider provider = 1 [(cloudgear.v1.immutable) = true];
  string name = 2 [(cloudgear.v1.immutable) = true];
  optional SecretService service = 3 [(cloudgear.v1.default_value) = "ssm"];
  // Defaults to the reading function's region, or the deploy region for a DNS token.
  optional string region = 4;
  // The KMS key that encrypts secrets written through cloudgear.
  optional string kms_key = 5;
}

// One secret: its name under a path in a store. It has no "name" field, so it is not a kind.
message SecretRef {
  string store = 1 [(cloudgear.v1.references) = "SecretStore"];
  // A prefix such as "/app": a leading slash, no trailing "/*".
  string path = 2;
  // The secret's name under the path.
  string secret = 3;
}
