syntax = "proto3";

package cloudgear;

// Written by `cloudgear generate`, read by `cloudgear plan|apply|import|destroy`.
message Config {
  string project = 1;
  // "aws" | "gcp" | ...
  string provider = 2;
  repeated Resource resource = 3;
  repeated Function function = 4;
  // IAM principals (role/user ARNs or account ids) allowed to invoke the functions.
  repeated string invoker = 5;
  // "iam" (callers must sign requests) or "none" (public function URLs).
  string authenticated = 6;
  // The DNS zone holding this app's records; set when a certificate or CDN is declared.
  Dns dns = 7;
  Certificate certificate = 8;
  Cdn cdn = 9;
  // Region of the functions; empty means the region the deployer chooses (--region or AWS_REGION).
  string region = 10;
}

message Dns {
  // "gandi" | "aws"
  string provider = 1;
  string domain = 2;
  string zone = 3;
}

message Certificate {
  string domain = 1;
}

message Cdn {
  string provider = 1;
  string domain = 2;
  // Logical name of the Resource serving the static site.
  string bucket = 3;
  // Key prefix of the site within the bucket ("" for the root).
  string path = 4;
  repeated Behavior behavior = 5;
}

// Routes the CDN sends to a function instead of the bucket.
message Behavior {
  string path_pattern = 1;
  // Name of a Function.
  string function = 2;
  repeated string method = 3;
}

message Resource {
  // Logical name, from the client URI, e.g. "myblob" in `new BlobStore("aws", "://myblob")`.
  string name = 1;
  // Inferred flagship service, e.g. "@aws.S3".
  string type = 2;
  string physical_name = 3;
  // `// cloudgear: dry` -- never created, updated or deleted.
  bool dry = 4;
  // "<file>:<line>" of the client construction.
  string source = 5;
  // Region the resource lives in; empty means the region the app is deployed to.
  string region = 6;
}

message Function {
  string name = 1;
  // Inferred flagship service, e.g. "@aws.Lambda".
  string type = 2;
  string physical_name = 3;
  string runtime = 4;
  int32 memory_mb = 5;
  int32 timeout_s = 6;
  Source source = 7;
  repeated Route route = 8;
  Bundle bundle = 9;
  repeated Permission permission = 10;
  repeated Env env = 11;
  // 0 leaves concurrency unreserved.
  int32 reserved_concurrency = 12;
}

message Source {
  string file = 1;
  string export = 2;
  string input_type = 3;
  // Set when the function is a method of the exported object `export`.
  string member = 4;
}

message Route {
  string method = 1;
  string path = 2;
  // Nickname used as the key in FunctionRouter.listen() results.
  string name = 3;
}

message Bundle {
  // Single-file bundle of the function's import tree, node_modules included.
  string path = 1;
  string sha256 = 2;
}

message Permission {
  // Logical name of a Resource.
  string resource = 1;
  repeated string action = 2;
  // Key prefix the access is confined to; empty means the whole bucket.
  string path = 3;
}

message Env {
  string key = 1;
  oneof source {
    string value = 2;
    // Logical name of a Resource; its physical name becomes the value.
    string value_from = 3;
  }
}
